<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200">
  <!-- 반창고 붙이고 수리 중인 로봇 (직접 그린 그림) -->
  <!-- 안테나 -->
  <line x1="70" y1="12" x2="70" y2="30" stroke="#7aa9c4" stroke-width="4"/>
  <circle cx="70" cy="10" r="7" fill="#ff8fab"/>
  <!-- 머리 -->
  <rect x="28" y="30" width="84" height="60" rx="18" fill="#d6ecf8" stroke="#7aa9c4" stroke-width="3"/>
  <!-- 왼쪽 눈(정상) / 오른쪽 눈(>< 고장) -->
  <circle cx="52" cy="58" r="8" fill="#3f4a5a"/>
  <circle cx="54" cy="55" r="2.5" fill="#fff"/>
  <path d="M82 50 L94 58 L82 66" fill="none" stroke="#3f4a5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="72" width="24" height="6" rx="3" fill="#3f4a5a"/>
  <ellipse cx="40" cy="74" rx="6" ry="4" fill="#ffb3c1"/>
  <ellipse cx="100" cy="74" rx="6" ry="4" fill="#ffb3c1"/>
  <!-- 반창고 -->
  <g transform="rotate(30 96 36)">
    <rect x="80" y="30" width="32" height="12" rx="6" fill="#ffe3b3"/>
    <circle cx="92" cy="36" r="1.5" fill="#e0b06a"/>
    <circle cx="100" cy="36" r="1.5" fill="#e0b06a"/>
  </g>
  <!-- 몸통 -->
  <rect x="62" y="90" width="16" height="8" fill="#7aa9c4"/>
  <rect x="30" y="98" width="80" height="66" rx="14" fill="#d6ecf8" stroke="#7aa9c4" stroke-width="3"/>
  <path d="M70 146 C50 132 58 116 70 125 C82 116 90 132 70 146 Z" fill="#ff8fab"/>
  <!-- 팔 + 스패너 -->
  <line x1="30" y1="112" x2="12" y2="138" stroke="#7aa9c4" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="112" x2="126" y2="92" stroke="#7aa9c4" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(35 128 82)">
    <rect x="124" y="70" width="8" height="30" rx="3" fill="#a7b3bf"/>
    <circle cx="128" cy="68" r="9" fill="#a7b3bf"/>
    <rect x="124" y="58" width="8" height="10" fill="#fffbe6"/>
  </g>
  <!-- 바퀴 -->
  <circle cx="50" cy="178" r="14" fill="#3f4a5a"/>
  <circle cx="90" cy="178" r="14" fill="#3f4a5a"/>
  <circle cx="50" cy="178" r="5" fill="#ffd36b"/>
  <circle cx="90" cy="178" r="5" fill="#ffd36b"/>
</svg>
